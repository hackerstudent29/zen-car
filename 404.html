<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Sanctuary Not Found | ZEN Automotive</title>
  <meta name="description" content="The requested path has dissolved into tranquility. Return to the ZEN GT sanctuary.">
  <meta name="theme-color" content="#0d0d0c">
  
  <!-- Favicon & Manifest -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="manifest" href="/site.webmanifest">
  
  <style>
    .not-found-body {
      background: #0d0d0c;
      color: #FFFFFF;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
      position: relative;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .not-found-glow {
      position: absolute;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(200, 169, 126, 0.12) 0%, rgba(13, 13, 12, 0) 70%);
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 0;
    }
    .not-found-card {
      position: relative;
      z-index: 1;
      max-width: 580px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 4rem 3rem;
      border-radius: 30px;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
    }
    .not-found-code {
      font-size: 5.5rem;
      line-height: 1;
      letter-spacing: 0.15em;
      background: linear-gradient(135deg, #FFFFFF 0%, #C8A97E 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 1rem;
    }
    .not-found-kicker {
      font-size: 0.85rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: #A6865E;
      display: block;
      margin-bottom: 1rem;
    }
    .not-found-title {
      font-size: 2.2rem;
      color: #FFFFFF;
      margin-bottom: 1.25rem;
      line-height: 1.2;
    }
    .not-found-desc {
      font-size: 1.05rem;
      color: #A8A296;
      line-height: 1.7;
      margin-bottom: 2.5rem;
    }
    .not-found-actions {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn-glow {
      padding: 0.9rem 2rem;
      border-radius: 50px;
      font-size: 0.85rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      text-decoration: none;
    }
    .btn-primary {
      background: #FFFFFF;
      color: #1C1B19;
    }
    .btn-primary:hover {
      background: #EBE7DC;
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(255, 255, 255, 0.2);
    }
    .btn-secondary {
      background: rgba(255, 255, 255, 0.08);
      color: #FFFFFF;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.18);
      transform: translateY(-2px);
    }
    @media (max-width: 600px) {
      .not-found-card { padding: 2.5rem 1.5rem; }
      .not-found-code { font-size: 4rem; }
      .not-found-title { font-size: 1.8rem; }
    }
  </style>
</head>
<body class="not-found-body">
  <div class="not-found-glow"></div>
  
  <main class="not-found-card">
    <span class="not-found-kicker">Navigation Coordinate Lost</span>
    <div class="not-found-code">404</div>
    <h1 class="not-found-title">The Path Has Dissolved</h1>
    <p class="not-found-desc">The sanctuary coordinate you requested does not exist in this realm. Regain your equilibrium and return to the main experience.</p>
    
    <div class="not-found-actions">
      <a href="/" class="btn-glow btn-primary">
        Return to Sanctuary
      </a>
      <a href="/full-video" class="btn-glow btn-secondary">
        Cinematic Drive
      </a>
    </div>
  </main>
</body>
</html>
